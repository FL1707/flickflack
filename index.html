<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Flickflack</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flickflack">
<meta name="theme-color" content="#1B1340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Turn-App für Kinder: Kopfzeile mit Logo, Inhalte in Karten, feste Tab-Leiste unten (iPad-tauglich). */
:root {
  --bg: #F4F1FA; --surface: #FFFFFF; --surface-2: #EAE4F5; --ink: #1B1340; --ink-soft: #5A5175; --line: #DCD3EC;
  --pink: #E5007D; --pink-ink: #B8005F; --teal: #00A99B; --yellow: #FFC93C; --blue: #2D5BD7; --orange: #FF7A1A;
  --gold: #E8B400; --silver: #A7AEBB; --bronze: #C7793B; --good: #18A058; --bad: #D9364A;
  --shadow: 0 2px 0 rgba(27,19,64,.07), 0 8px 24px -12px rgba(27,19,64,.28);
  --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; --r: 18px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #120D26; --surface: #1E173A; --surface-2: #2A2150; --ink: #F3F0FB; --ink-soft: #B3AACB; --line: #3A3060;
  --pink: #FF3D9E; --pink-ink: #FF7DBD; --teal: #2CD3C3; --yellow: #FFD54F; --blue: #6E93FF; --orange: #FF9A4D;
  --good: #3DD07E; --bad: #FF6B7D; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #120D26; --surface: #1E173A; --surface-2: #2A2150; --ink: #F3F0FB; --ink-soft: #B3AACB; --line: #3A3060;
  --pink: #FF3D9E; --pink-ink: #FF7DBD; --teal: #2CD3C3; --yellow: #FFD54F; --blue: #6E93FF; --orange: #FF9A4D;
  --good: #3DD07E; --bad: #FF6B7D; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px -12px rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); margin: 0; }
body { color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #1B1340; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--pink-ink); }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.05; text-wrap: balance; margin: 0; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #1B1340; color: #fff;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; color: #fff; }
.logo svg { width: 40px; height: 40px; flex: none; }
.logo b { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 30px; letter-spacing: .5px; }
.logo b span { color: var(--yellow); }
.stamp { margin-left: auto; text-align: right; font-size: 13px; line-height: 1.25; color: #CFC7E6; }
.stamp strong { display: block; color: #fff; font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 28px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-h h2 { font-size: 30px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: .3px; }
.sec-h p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.empty { padding: 40px 0; text-align: center; color: var(--ink-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase;
  padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 99px; padding: 10px 18px;
  background: var(--pink); color: #fff; font-weight: 800; }
.btn.alt { background: var(--surface-2); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--pink-ink); font-weight: 800; text-decoration: underline; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-weight: 800; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.term { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted var(--pink); text-underline-offset: 3px; }
/* Tab-Leiste */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 8px 0 7px; font-size: 11.5px; font-weight: 800; color: var(--ink-soft); min-width: 0; }
.tab svg { width: 28px; height: 28px; }
.tab[aria-selected="true"] { color: var(--pink); }
.tab[aria-selected="true"] .ic-bg { fill: color-mix(in srgb, var(--pink) 14%, transparent); }
/* News */
.hello { margin: 0; font-size: 17px; }
.top-story { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 0; padding: 0; overflow: hidden; text-align: left; width: 100%; color: inherit; font: inherit; }
.top-story .art { aspect-ratio: auto; min-height: 240px; }
.top-story .txt { padding: 20px; display: grid; gap: 8px; align-content: center; }
.top-story h3 { font-size: 34px; font-weight: 800; }
@media (max-width: 700px) { .top-story { grid-template-columns: 1fr; } .top-story .art { min-height: 180px; } .top-story h3 { font-size: 28px; } }
.news-card { padding: 0; overflow: hidden; display: grid; grid-template-rows: auto 1fr; text-align: left; color: inherit; font: inherit; width: 100%; }
.news-card .txt { padding: 14px 16px 16px; display: grid; gap: 6px; align-content: start; }
.news-card h3 { font-size: 23px; font-weight: 800; }
.news-card p, .top-story p { margin: 0; color: var(--ink-soft); font-size: 15.5px; }
.art { display: block; width: 100%; aspect-ratio: 16 / 9; }
.art svg { display: block; width: 100%; height: 100%; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.hl { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.hl .card { display: grid; gap: 6px; align-content: start; }
.hl .big { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; color: var(--pink); }
.hl h3 { font-size: 22px; }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-soft); }
.count { display: flex; gap: 10px; }
.count div { background: var(--surface-2); border-radius: 12px; padding: 6px 10px; text-align: center; min-width: 58px; }
.count b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1; }
.count span { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
/* Ergebnisse */
.wk { display: grid; gap: 12px; }
.wk-h { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.wk-h h3 { font-size: 26px; font-weight: 800; }
.ent { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.ent h4 { margin: 0; font-size: 16px; font-weight: 800; }
.pod { display: grid; gap: 4px; }
.pod-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 10px; }
.pod-row.de { background: color-mix(in srgb, var(--yellow) 22%, transparent); }
.medal { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; color: #1B1340; font-size: 15px; background: var(--surface-2); }
.m1 { background: var(--gold); } .m2 { background: var(--silver); } .m3 { background: var(--bronze); color: #fff; }
.note-btn { border: 0; background: var(--surface-2); border-radius: 10px; padding: 2px 9px; font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.note-split { font-size: 13px; color: var(--ink-soft); grid-column: 2 / -1; }
.duell { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.duell .t { font-weight: 800; }
.duell .t.r { text-align: right; }
.duell .sc { font-family: var(--font-display); font-weight: 800; font-size: 28px; white-space: nowrap; }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { padding: 6px 6px; text-align: left; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 12px; text-transform: uppercase; color: var(--ink-soft); letter-spacing: .4px; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
.explain { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.explain div { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.explain b { font-family: var(--font-display); font-size: 26px; display: block; line-height: 1; }
/* Upcoming */
.term-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: start; }
.datebox { background: var(--surface-2); border-radius: 14px; text-align: center; padding: 6px 4px; }
.datebox b { display: block; font-family: var(--font-display); font-size: 28px; line-height: 1; }
.datebox span { font-size: 12px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; }
.term-row h3 { font-size: 22px; }
.term-row.hi .datebox { background: var(--pink); color: #fff; } .term-row.hi .datebox span { color: #fff; }
.month { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-style: italic; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
/* Training */
.tr-top { display: grid; gap: 12px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 99px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 7px 16px; font-weight: 800; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); color: var(--pink-ink); }
.geraete { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 150px), 1fr)); gap: 10px; }
.geraet { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 8px; display: grid; justify-items: center; gap: 2px; font-weight: 800; }
.geraet svg { width: 64px; height: 48px; }
.geraet small { font-weight: 700; color: var(--ink-soft); font-size: 12px; }
.geraet[aria-pressed="true"] { border-color: var(--pink); background: color-mix(in srgb, var(--pink) 8%, var(--surface)); }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--pink)); border-radius: 99px; }
.teil { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 520px) { .teil { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; } }
.skizze { background: var(--surface-2); border-radius: 14px; aspect-ratio: 6 / 5; display: grid; place-items: center; }
.skizze svg { width: 100%; height: 100%; }
.nr { display: inline-grid; place-items: center; min-width: 34px; height: 30px; padding: 0 8px; border-radius: 10px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.nr.bonus { background: var(--yellow); color: #1B1340; }
.teil-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.teil p { margin: 0 0 8px; }
.werte { display: grid; gap: 3px; margin: 0 0 8px; padding: 0; list-style: none; font-size: 15px; }
.werte li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 2px; }
.werte b { font-family: var(--font-display); font-size: 18px; }
details.fehler summary { cursor: pointer; font-weight: 800; color: var(--ink-soft); font-size: 14px; }
details.fehler ul { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; color: var(--ink-soft); }
.kann { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 99px; padding: 5px 12px; background: var(--surface); font-weight: 800; font-size: 14px; margin-top: 8px; }
.kann[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.hinweis { background: color-mix(in srgb, var(--yellow) 25%, transparent); border-radius: 10px; padding: 6px 10px; font-size: 14.5px; margin: 0 0 8px; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.vid { display: flex; gap: 8px; flex-wrap: wrap; }
.vid a { text-decoration: none; }
/* Quiz */
.q { display: grid; gap: 10px; }
.q h3 { font-family: var(--font-body); font-size: 18px; font-weight: 800; line-height: 1.35; }
.answers { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.answers button { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; font-weight: 700; }
.answers button.ok { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--surface)); }
.answers button.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.answers button:disabled { cursor: default; color: inherit; }
.erkl { margin: 0; font-size: 15px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
.score { font-family: var(--font-display); font-size: 40px; font-weight: 800; color: var(--pink); line-height: 1; }
/* Game */
.game-wahlen { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.game-wahl { display: grid; gap: 8px; align-content: start; }
.game-wahl h3 { font-size: 28px; }
.game-zahlen b { font-family: var(--font-display); font-size: 54px; line-height: 1; color: var(--pink); display: block; }
.game-feld { padding: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 520px; width: 100%; justify-self: center; }
.game-feld canvas { display: block; width: 100%; height: auto; }
.game-top { display: flex; justify-content: center; gap: 22px; font-weight: 800; color: var(--ink-soft); font-size: 14px; }
.game-top b { display: block; font-family: var(--font-display); font-size: 28px; color: var(--ink); text-align: center; }
/* Statistik */
.fort { display: grid; gap: 10px; }
.fort-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-weight: 800; }
.fort-row span:last-child { text-align: right; font-family: var(--font-display); font-size: 20px; }
.badges { display: flex; gap: 10px; flex-wrap: wrap; }
.badge { display: grid; justify-items: center; gap: 2px; width: 92px; text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.badge i { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 28px; background: var(--surface-2); filter: grayscale(1); opacity: .5; }
.badge.on i { background: var(--yellow); filter: none; opacity: 1; }
.badge.on { color: var(--ink); }
.held { display: grid; gap: 6px; }
.held h3 { font-size: 24px; }
.held ul { margin: 0; padding-left: 18px; font-size: 15px; }
/* Overlay */
#overlay .ov { position: fixed; inset: 0; z-index: 40; background: rgba(18,13,38,.55); display: grid; place-items: end center; }
@media (min-width: 700px) { #overlay .ov { place-items: center; } }
.sheet { background: var(--bg); width: min(760px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .sheet { border-radius: 22px; } }
.sheet .in { padding: 16px 20px; display: grid; gap: 12px; }
.sheet h2 { font-size: 34px; font-weight: 800; }
.sheet p { margin: 0; }
.close { position: sticky; top: 10px; float: right; margin: 10px 10px 0 0; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: var(--shadow); font-size: 22px; font-weight: 800; }
.term-pop .in { padding-top: 20px; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="logo" data-tab="heute" aria-label="Zur Startseite">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#E5007D"/><path d="M8 29 C 10 12, 30 12, 32 29" fill="none" stroke="#FFC93C" stroke-width="2.4" stroke-dasharray="3 3" stroke-linecap="round"/><circle cx="20" cy="10.5" r="3.4" fill="#fff"/><path d="M20 14 L20 22 M20 16 L14 12 M20 16 L26 12 M20 22 L15 29 M20 22 L25 29" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
    <b>FLICK<span>FLACK</span></b>
  </button>
  <div class="stamp" id="stamp"><strong>Lade Neuigkeiten …</strong></div>
</div></header>
<main id="main"><div class="empty">Die neuesten Turn-News werden geladen …</div></main>
<nav class="tabs" aria-label="Bereiche"><div class="tabs-in" role="tablist" id="tabs"></div></nav>
<div id="overlay"></div>
<script>
(function () {
  "use strict";
  const IC = s => '<circle class="ic-bg" cx="16" cy="16" r="15" fill="none"/>' + s;
  const TABS = [
    { id: "heute", label: "News", icon: IC('<rect x="6" y="7" width="20" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M10 12h12M10 16h12M10 20h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>') },
    { id: "ergebnisse", label: "Ergebnisse", icon: IC('<path d="M9 25h14M16 21v4M10 7h12v5a6 6 0 0 1-12 0z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 9H6.5a3.5 3.5 0 0 0 4 4.5M22 9h3.5a3.5 3.5 0 0 1-4 4.5" fill="none" stroke="currentColor" stroke-width="2"/>') },
    { id: "upcoming", label: "Upcoming", icon: IC('<rect x="6" y="8" width="20" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M6 13h20M11 5v5M21 5v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="19" r="2.4" fill="currentColor"/>') },
    { id: "training", label: "Training", icon: IC('<path d="M5 26h22M9 26V12M23 26V12M7 12h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="6.5" r="2.4" fill="currentColor"/><path d="M16 9v8M12 12l4-2 4 2M13 22l3-5 3 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>') },

    reck: '<path d="M10 46V10M54 46V10M10 11H54" stroke="currentColor" stroke-width="2.4" fill="none" opacity=".6"/>' + figSvg(32, 34, { t: -20, a: 180 }, .5, "currentColor"),

    regeln: '<rect x="16" y="6" width="32" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M22 16h20M22 24h20M22 32h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'
  };
  const kannKey = (g, u, nr) => "kann_" + g + "_" + u + "_" + nr;
  function kannAlle() { return store.get("kann", {}); }
  function fortschritt(g, u) {
    const k = kannAlle(), gg = T.geraete.find(x => x.id === g), uu = gg && gg.uebungen.find(x => x.id === u); if (!uu) return [0, 0];
    const t = uu.teile.length; let n = 0; uu.teile.forEach(x => { if (k[kannKey(g, u, x.nr)]) n++; }); return [n, t];
  }
  function teilHtml(g, u, x) {

  function vTraining() {
    if (!T) return '<div class="view"><p class="muted">Trainingsdaten werden geladen …</p></div>';

          u.teile.map(x => teilHtml(g.id, u.id, x)).join("");

    return '<div class="view"><section class="sec tr-top"><div class="sec-h"><h2>Training</h2><p>' + esc(T.ak11 || "") + "</p></div>" +
      '<div class="seg" role="group" aria-label="Altersklasse"><button data-ak="11" aria-pressed="' + (ui.ak === "11") + '">AK 11</button><button data-ak="12" aria-pressed="' + (ui.ak === "12") + '">AK 12</button></div>' +
      '<div class="geraete">' + tiles + "</div></section>" + '<section class="sec">' + body + "</section>" +
      '<p class="small muted">Quellen: ' + T.quellen.map(q => esc(q.name) + " (Stand " + esc(q.stand) + ")").join(" · ") + ". Bei Fragen gilt immer, was dein Trainer sagt.</p></div>";

    if (d.uebung) { const p = d.uebung.split("|"); ui.uebung[p[0]] = p[1]; saveUi(); return render(); }
    if (d.kann) { const p = d.kann.split("|"), k = kannAlle(), key = kannKey(p[0], p[1], p[2]); if (k[key]) delete k[key]; else k[key] = 1; store.set("kann", k); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (d.quiz) { const p = d.quiz.split("|").map(Number), y = window.scrollY; answerQuiz(p[0], p[1]); window.scrollTo(0, y); return; }
    if (d.kr != null) { store.set("kr_" + (D.quizId || ""), Number(d.kr)); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (d.gstart) return gameStart(d.gstart);
    if (d.gabbruch != null) { GM = null; return render(); }
  });
  document.addEventListener("change", e => {
    const s = e.target.closest("select[data-athl]"); if (!s) return;
    const a = store.get("athl", {}); if (s.value === "") delete a[s.dataset.athl]; else a[s.dataset.athl] = Number(s.value); store.set("athl", a);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  window.addEventListener("hashchange", () => { const h = (location.hash || "").slice(1); if (VIEWS[h] && h !== current) go(h); });
  const h0 = (location.hash || "").slice(1); if (VIEWS[h0]) current = h0;
  render();
  const get = f => fetch(f + "?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
  Promise.all([get("data.json"), get("training.json"), get("statistik.json")]).then(([d, t, s]) => {
    D = d || { news: [] }; T = t; S = s;
    const st = $("#stamp");
    if (d) { const a = new Date(d.aktualisiert); st.innerHTML = "<strong>" + esc((d.ausgabe || "").replace(/ \d{4}-\d{2}-\d{2}$/, "")) + "</strong>" + (isNaN(a) ? "" : WT[a.getDay()] + ", " + a.getDate() + ". " + MON[a.getMonth()] + ", " + String(a.getHours()).padStart(2, "0") + ":" + String(a.getMinutes()).padStart(2, "0") + " Uhr"); }
    else st.innerHTML = "<strong>Offline</strong>Keine neuen Daten";
    render();
  });
})();
</script>
</body>
